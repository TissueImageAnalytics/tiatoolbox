# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

permissions:
  contents: read

on:
  push:
    branches: [ develop, master, main ]
    tags: v*
  pull_request:
    branches: [ develop, pre-release, master, main ]

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get install -y libopenjp2-7 libopenjp2-tools
        python -m pip install --upgrade pip
        python -m pip install ruff==0.16.1 pytest pytest-cov pytest-runner
        pip install uv
        uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

    # Only collect Rust coverage once, using Python 3.12.
    - name: Install cargo-llvm-cov
      if: matrix.python-version == '3.12'
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Set Rust coverage environment
      if: matrix.python-version == '3.12'
      run: |
        cargo llvm-cov show-env --sh > llvm-cov-env.sh

    # This replaces "uv pip install --system -e ." from the dependency step.
    # On Python 3.12 the Rust extension is built with coverage instrumentation.
    - name: Install TIAToolbox
      run: |
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          source llvm-cov-env.sh
          cargo llvm-cov clean --workspace
        fi

        uv pip install --system -e .

    - name: Cache tiatoolbox static assets
      uses: actions/cache@v4
      with:
        key: tiatoolbox-home-static
        path: ~/.tiatoolbox

    - name: Print Version Information
      run: |
        echo "---SQlite---"
        sqlite3 --version
        sqlite3 ":memory:" -list ".output stdout" "pragma compile_options" ".exit"
        echo "---OpenJPEG---"
        opj_dump -h | head -n 5
        echo "---Python---"
        python -c "import sys; print('Python %s' % sys.version)"
        python -c "import sqlite3; print('SQLite %s' % sqlite3.sqlite_version)"
        python -c "import numpy; print('Numpy %s' % numpy.__version__)"
        python -c "import openslide; print('OpenSlide %s' % openslide.__version__)"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Test with pytest
      run: |
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          source llvm-cov-env.sh
        fi

        pytest --basetemp={envtmpdir} \
           --cov=tiatoolbox --cov-report=term --cov-report=xml --cov-config=pyproject.toml \
           --capture=sys \
           --durations=10 --durations-min=1.0 \
           --maxfail=1

    # Python tests have now exercised the instrumented Rust library.
    - name: Generate Rust coverage report
      if: matrix.python-version == '3.12'
      run: |
        source llvm-cov-env.sh
        cargo llvm-cov report --lcov --output-path rust-lcov.info

    - name: Report Python test coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        disable_search: true
        flags: python
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

    - name: Report Rust coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        files: rust-lcov.info
        disable_search: true
        flags: rust
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

    - name: Report test coverage to DeepSource
      uses: deepsourcelabs/test-coverage-action@master
      with:
        key: python
        coverage-file: coverage.xml
        dsn: ${{ secrets.DEEPSOURCE_DSN }}
        fail-ci-on-error: false

    - name: List tiatoolbox contents
      run: ls -lahR ~/.tiatoolbox

    - name: Delete Hugging Face cache for large models
      run: |
        find ~/.tiatoolbox/models -type f -size +250M -exec bash -c '
          for model_path; do
            model_name=$(basename "$model_path")
            cache_dir="$HOME/.tiatoolbox/models/.cache/huggingface/download"
            rm -vf "$cache_dir/${model_name}.lock" "$cache_dir/${model_name}.metadata"
          done
          ' bash {} +

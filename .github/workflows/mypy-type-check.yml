# This workflow will perform code type checking using mypy

name: mypy type checking
permissions:
  contents: read

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ develop, pre-release, master, main ]

jobs:

  build:

    runs-on: ubuntu-24.04

    # Install/run mypy on each supported Python, and pass --python-version so
    # the type check target matches the matrix (overrides [tool.mypy].python_version).
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get install -y libopenslide-dev openslide-tools libopenjp2-7 libopenjp2-tools
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
        uv pip install --system -e ".[dev]"

    - name: Debug typing environment
      run: |
        python --version
        mypy --version
        pip freeze | grep -E '^(mypy|types-)'

    - name: Perform type checking
      run: |
        mypy --python-version ${{ matrix.python-version }} \
          --install-types --non-interactive --follow-imports=skip --ignore-missing-imports \
          tiatoolbox/__init__.py \
          tiatoolbox/__main__.py \
          tiatoolbox/type_hints.py \
          tiatoolbox/tiatoolbox.py \
          tiatoolbox/utils \
          tiatoolbox/tools \
          tiatoolbox/data \
          tiatoolbox/annotation \
          tiatoolbox/cli/common.py \
          tiatoolbox/models/__init__.py \
          tiatoolbox/models/models_abc.py \
          tiatoolbox/models/architecture/__init__.py \
          tiatoolbox/models/architecture/utils.py \
          tiatoolbox/wsicore/__init__.py \
          tiatoolbox/wsicore/wsimeta.py \
          tiatoolbox/wsicore/metadata/ \
          tiatoolbox/wsicore/wsireader/factory.py \
          tiatoolbox/wsicore/wsireader/detection.py \
          tiatoolbox/wsicore/wsireader/types.py

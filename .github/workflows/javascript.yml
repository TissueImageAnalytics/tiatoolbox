name: JavaScript

permissions:
  contents: read

on:
  push:
    branches: [develop, master, main]
    tags: v*
  pull_request:
    branches: [develop, pre-release, master, main]

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: tiatoolbox/visualization/openlayers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: tiatoolbox/visualization/openlayers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Test JavaScript
        run: npm run test:coverage

      - name: Build OpenLayers viewer
        run: npm run build

      - name: Build legacy OpenLayers viewer
        run: npm run build:legacy

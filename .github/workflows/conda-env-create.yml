# This workflow will build a conda environment to check that it resolves in a reasonable time

name: Solve Conda Environment

permissions:
  contents: read

on:
  push:
    paths:
      - "requirements/requirements*.txt"
      - "requirements/generate_conda_env.py"
      - ".github/workflows/conda-env-create.yml"
  pull_request:
    paths:
      - "requirements/requirements*.txt"
      - "requirements/generate_conda_env.py"
      - ".github/workflows/conda-env-create.yml"
  schedule:
    - cron: "0 0 1 * *"

jobs:
  conda_solve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ✅ Generate environment from requirements.txt
      - name: Generate conda environment
        run: |
          PYTHON_VERSION=${{ matrix.python-version }} \
          python requirements/generate_conda_env.py

      # ✅ Install with micromamba (pure conda solve)
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: tiatoolbox
          environment-file: requirements/requirements.conda.generated.yml
          install-only: true

      # ✅ Validate environment
      - name: Test environment
        shell: bash -l {0}
        run: |
          micromamba info
          micromamba list

          python - <<EOF
          import sys
          print("✅ Python:", sys.version)

          import numpy
          import pandas
          print("✅ Core stack OK")

          # Optional imports (fail if missing)
          try:
              import torch
              print("✅ Torch OK")
          except Exception as e:
              print("⚠️ Torch issue:", e)

          try:
              import cv2
              print("✅ OpenCV OK")
          except Exception as e:
              print("⚠️ OpenCV issue:", e)

          try:
              import SimpleITK
              print("✅ SimpleITK OK")
          except Exception as e:
              print("⚠️ SimpleITK issue:", e)

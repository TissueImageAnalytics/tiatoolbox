# This workflow will build a conda environment to check that it resolves

name: Solve Conda Environment

permissions:
  contents: read

on:
  push:
    paths: [ "requirements/generate_conda_env.py", "conda-env-create.yml", "pyproject.toml"]
    branches: [ develop, master, main ]
  pull_request:
    paths: [ "requirements/generate_conda_env.py", "conda-env-create.yml", "pyproject.toml"]
    branches: [ develop, pre-release, master, main ]
  schedule: # Run on the 1st of every month at midnight
    - cron: "0 0 1 * *"

jobs:
  conda_solve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ✅ Generate environment
      - name: Generate conda environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: python requirements/generate_conda_env.py

      # ✅ Install via micromamba
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: tiatoolbox
          environment-file: requirements/requirements.conda.generated.yml

      # ✅ Validate environment
      - name: Test environment
        shell: bash -l {0}
        run: |
          micromamba list

          python - <<EOF
          import sys
          print("Python:", sys.version)

          import numpy, pandas
          print("Core OK")

          try:
              import torch
              print("Torch OK")
          except Exception as e:
              print("Torch issue:", e)

          try:
              import cv2
              print("OpenCV OK")
          except Exception as e:
              print("OpenCV issue:", e)

          try:
              import openslide
              print("OpenSlide OK")
          except Exception as e:
              print("OpenSlide issue:", e)
          EOF

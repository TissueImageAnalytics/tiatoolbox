<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <script src="/js/polyfill.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/fontawesome-all.min.css" />

    <!-- OpenLayers viewer -->
    <link rel="stylesheet" href="/openlayers/viewer.css" />

    <title>{{ title }}</title>
</head>

<body>
    <div class="viewer-app">
        <div
            id="map"
            class="map"
            data-layers="{{ layers }}"
        ></div>

        <div class="viewer-panel-control ol-unselectable ol-control">
            <button
                id="viewer-panel-toggle"
                type="button"
                title="Toggle viewer panel"
            >
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <aside id="viewer-panel" class="viewer-panel hidden">
            <div class="viewer-panel-header">
                <span>TIAToolbox</span>
            </div>

            <div class="viewer-panel-section">
                <h2>Slide</h2>

                <div id="current-slide" class="current-slide">
                    No slide selected
                </div>

                <button id="load-slide" type="button">
                    Load slide
                </button>
            </div>

            <div class="viewer-panel-section">
                <h2>Layers</h2>

                <div id="layer-list" class="layer-list"></div>

                <button id="add-overlay" type="button">
                    Add overlay
                </button>
            </div>
        </aside>
    </div>

    <script type="module" src="/openlayers/viewer.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <script src="/js/polyfill.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/fontawesome-all.min.css" />

    <!-- OpenLayers viewer -->
    <link rel="stylesheet" href="/openlayers/visualize_beta_viewer.css" />

    <title>{{ title }}</title>
</head>

<body>
    <div class="viewer-app">
        <div
            id="map"
            class="map"
            data-layers="{{ layers }}"
        ></div>

        <div class="layer-editor-control ol-unselectable ol-control">
            <button
                id="layer-editor-toggle"
                type="button"
                title="Toggle layer editor"
            >
                <i class="fas fa-sliders-h"></i>
            </button>
        </div>

        <aside id="layer-editor" class="layer-editor hidden">
            <div class="layer-editor-header">
                Layers
            </div>

            <div id="layer-editor-list" class="layer-editor-list">
                <div class="layer-editor-empty">
                    No layers loaded
                </div>
            </div>
        </aside>

        <div class="viewer-panel-control ol-unselectable ol-control">
            <button
                id="viewer-panel-toggle"
                type="button"
                title="Toggle viewer panel"
            >
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <aside id="viewer-panel" class="viewer-panel hidden">
            <div class="viewer-panel-header">
                <span>TIAToolbox</span>
            </div>

            <div class="viewer-panel-section">
                <h2>Slide</h2>

                <div id="current-slide" class="current-slide">
                    No slide selected
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="/openlayers/visualize_beta_viewer.js"></script>
</body>

</html>
